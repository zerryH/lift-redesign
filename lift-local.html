.picker{margin:18px -20px 4px;padding:0 20px 4px}

.range-window{position:absolute;inset:0;overflow:hidden;border-radius:18px;mask-image:linear-gradient(90deg,transparent 0,#000 10%,#000 90%,transparent 100%);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 10%,#000 90%,transparent 100%)}

.range-window:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,var(--cd),transparent 14%,transparent 86%,var(--cd));opacity:.8;pointer-events:none;z-index:2}
.ruler-track{position:absolute;left:50%;bottom:18px;display:flex;align-items:flex-end;height:64px;will-change:transform;transform:translate3d(var(--tx,0px),0,0);transition:transform .12s cubic-bezier(.2,.8,.2,1)}
.ruler-tick{position:relative;flex:0 0 28px;width:28px;height:56px;display:flex;align-items:flex-end;justify-content:center}

.ruler-tick.major i{height:25px;width:3px;background:color-mix(in srgb,var(--fg) 70%,transparent)}
.ruler-tick span{position:absolute;left:50%;bottom:29px;transform:translateX(-50%);font-size:10px;font-weight:700;color:var(--mu);white-space:nowrap;opacity:.8}

.range:active{cursor:grabbing}.range::-webkit-slider-runnable-track{height:100%;background:transparent}.range::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:28px;height:100%;margin:0;border:0;background:transparent}.range::-moz-range-track{height:100%;background:transparent}.range::-moz-range-thumb{width:28px;height:100%;border:0;background:transparent}
.range-wrap::marker{display:none}
.reps-picker .range-wrap{margin-top:2px}
[data-motion="1"] .ruler-track{transition:transform .22s cubic-bezier(.2,.8,.2,1)}
[data-motion="1"] .ruler-center{animation:markerPulse 2.8s ease-in-out infinite}

.reps-picker{margin-top:16px}.rp{display:flex;justify-content:center;align-items:center;gap:22px;margin:6px 0 0}.rp button{width:48px;height:48px;border-radius:50%;border:1px solid color-mix(in srgb,var(--ln) 84%,transparent);background:color-mix(in srgb,var(--cd) 86%,transparent);font-size:24px;cursor:pointer;position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 8px 20px rgba(0,0,0,.07);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}.rp label{text-align:center}.rp input{width:84px;height:48px;text-align:center;font-size:25px;font-weight:800;background:transparent;border:0;border-bottom:2px solid var(--ln)}.rp small{display:block}
.sets{background:color-mix(in srgb,var(--cd) 84%,transparent);border:1px solid color-mix(in srgb,var(--ln) 78%,transparent);border-radius:24px;padding:6px 16px;margin:14px 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 16px 36px rgba(0,0,0,.08);backdrop-filter:blur(18px) saturate(135%);-webkit-backdrop-filter:blur(18px) saturate(135%)}
.srow{display:flex;align-items:center;gap:10px;min-height:48px;border-bottom:1px solid var(--ln)}.srow:last-child{border:0}.srow span{color:var(--mu);font-size:12px;width:44px}.srow b{flex:1}
.srow button{min-width:40px;min-height:44px;background:none;border:0;color:var(--mu);font-size:18px;cursor:pointer}.tag{font-size:12px!important;font-weight:600}.tag.w{color:var(--ac)!important;font-weight:800}
.srow em{font-style:normal;font-size:10px;font-weight:800;background:var(--ac2);color:#fff;border-radius:99px;padding:2px 8px}.srow em:empty{display:none}
/* lists */
.row{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--ln)}.row>div{flex:1}.row small{display:block}.row .col{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.bar{display:block;height:4px;background:var(--ln);border-radius:2px;margin:8px 0 4px}.bar u{display:block;height:100%;background:var(--c,var(--ac));border-radius:2px}
.badge{align-self:flex-start;font-size:11px;font-weight:700;padding:4px 12px;border-radius:99px;color:var(--c);border:1px solid var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
/* ranks */
.big{text-align:center;margin:8px 0}.big b{font-size:44px;font-weight:800;display:block;line-height:1.1}.big span{font-weight:300;color:var(--mu)}
.fig{position:relative;height:330px;max-width:340px;margin:6px auto}.fig svg{height:100%;display:block;margin:auto}
.fig path,.fig circle{stroke:var(--bg);stroke-width:2}.sk{fill:#cfcbe0}.ab{fill:#3a3548}.pu{fill:var(--p)}.pl{fill:var(--u)}.lg{fill:var(--l)}
.co{position:absolute;background:var(--cd);border:1px solid var(--c);border-radius:14px;padding:6px 12px;min-width:92px}.co small{display:block}.co b{color:var(--c);font-size:15px}
.l1{left:0;top:62px}.r1{right:0;top:110px}.l2{left:0;bottom:44px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:8;display:flex;align-items:flex-end;justify-content:center}.bd{position:absolute;inset:0;background:#000b}
.sb{position:relative;width:100%;max-width:640px;max-height:92vh;overflow:auto;background:color-mix(in srgb,var(--cd) 90%,transparent);border:1px solid color-mix(in srgb,var(--ln) 72%,transparent);border-bottom:0;border-radius:30px 30px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -24px 70px rgba(0,0,0,.22);backdrop-filter:blur(26px) saturate(145%);-webkit-backdrop-filter:blur(26px) saturate(145%)}
.sb .hd{display:flex;justify-content:space-between;align-items:center}.ttl{font-size:22px;font-weight:800}.sb .hd button{min-width:44px;min-height:44px;background:none;border:0;font-size:26px;color:var(--mu);cursor:pointer}
.fl{display:block;color:var(--mu);font-size:12px;margin:10px 0}.fl input{display:block;width:100%;height:48px;margin-top:4px;padding:0 14px;background:var(--bg);border:1px solid var(--ln);border-radius:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px}
.res{margin-top:6px;padding:16px;border-radius:20px;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);text-align:center}.res b{display:block;font-size:40px;font-weight:800;color:var(--c);line-height:1.15}.res span{display:block;color:var(--mu)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:color-mix(in srgb,var(--fg) 92%,transparent);color:var(--bg);padding:12px 22px;border-radius:99px;font-weight:650;z-index:9;white-space:nowrap;box-shadow:0 14px 36px rgba(0,0,0,.22);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
@keyframes o{to{opacity:0}}
.note{background:var(--cd);border-radius:16px;padding:12px 16px;margin:8px 0}

/* frosted/glow layer + optional motion */
body{position:relative;overflow-x:hidden;isolation:isolate}
body::before,body::after{content:"";position:fixed;pointer-events:none;z-index:0;width:42vw;height:42vw;max-width:420px;max-height:420px;border-radius:50%;filter:blur(34px);opacity:.12;mix-blend-mode:screen}
body::before{left:-18vw;top:5vh;background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--ac) 78%,transparent),transparent 68%)}
body::after{right:-16vw;top:36vh;background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--ac2) 78%,transparent),transparent 68%)}
.q{position:relative}
[data-motion="1"] body::before{animation:blobFloatA 15s ease-in-out infinite alternate}
[data-motion="1"] body::after{animation:blobFloatB 18s ease-in-out infinite alternate}
[data-motion="1"] #v{animation:viewIn .45s cubic-bezier(.2,.8,.2,1)}
[data-motion="1"] .sb{animation:sheetIn .46s cubic-bezier(.16,1,.3,1)}
[data-motion="1"] .toast{animation:toastIn .36s cubic-bezier(.2,.9,.2,1),toastOut .5s 2.2s forwards}
[data-motion="1"] button,[data-motion="1"] .pill,[data-motion="1"] input{transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease,background .22s ease,border-color .22s ease,filter .22s ease}
[data-motion="1"] button:active,[data-motion="1"] .pill:active{transform:scale(.965)}
[data-motion="1"] .cta:active{transform:scale(.985) translateY(1px);filter:saturate(1.15) brightness(.98)}
[data-motion="1"] .pill:hover{box-shadow:0 10px 24px rgba(0,0,0,.11),inset 0 1px 0 rgba(255,255,255,.08)}
[data-motion="1"] .sets,[data-motion="1"] .note,[data-motion="1"] .co{animation:cardRise .5s cubic-bezier(.2,.85,.2,1) both}
[data-motion="1"] .srow{animation:rowIn .34s cubic-bezier(.2,.85,.2,1) both}
[data-motion="1"] .srow:nth-child(2){animation-delay:.03s}[data-motion="1"] .srow:nth-child(3){animation-delay:.06s}[data-motion="1"] .srow:nth-child(4){animation-delay:.09s}
[data-motion="1"] nav button.on svg{animation:iconBob 2.4s ease-in-out infinite}
[data-motion="1"] .big b{animation:glowPulse 3.5s ease-in-out infinite}
[data-motion="1"] .mid b{animation:numberPop .42s cubic-bezier(.2,.9,.2,1)}
.ripple{position:absolute;width:18px;height:18px;border-radius:50%;pointer-events:none;z-index:5;background:radial-gradient(circle,rgba(255,255,255,.6) 0%,rgba(255,255,255,.18) 38%,transparent 72%);transform:translate(-50%,-50%) scale(.2);filter:blur(.2px);animation:rippleOut .22s cubic-bezier(.2,.8,.2,1) forwards}.tap-glow{animation:tapGlow .18s cubic-bezier(.2,.8,.2,1)}
.toggle{min-height:48px;display:inline-flex;align-items:center;gap:10px;padding:0 14px;border-radius:999px;border:1px solid color-mix(in srgb,var(--ln) 82%,transparent);background:color-mix(in srgb,var(--cd) 82%,transparent);font-weight:700;position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 7px 18px rgba(0,0,0,.06);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.toggle .track{width:42px;height:24px;border-radius:99px;padding:3px;background:var(--ln);display:flex;align-items:center;justify-content:flex-start;box-shadow:inset 0 1px 2px rgba(0,0,0,.18)}
.toggle .track i{display:block;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transform:translateX(0)}
.toggle.on .track{background:linear-gradient(90deg,var(--ac),var(--ac2))}.toggle.on .track i{transform:translateX(18px)}
.toggle small{font-size:11px;color:var(--mu);margin-left:1px}
@keyframes blobFloatA{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(13vw,6vh,0) scale(1.08)}100%{transform:translate3d(5vw,15vh,0) scale(.95)}}
@keyframes blobFloatB{0%{transform:translate3d(0,0,0) scale(.96)}50%{transform:translate3d(-10vw,-7vh,0) scale(1.08)}100%{transform:translate3d(-2vw,8vh,0) scale(1)}}
@keyframes viewIn{from{opacity:0;transform:translateY(10px) scale(.992)}to{opacity:1;transform:none}}
@keyframes sheetIn{from{opacity:0;transform:translateY(36px) scale(.985)}to{opacity:1;transform:none}}
@keyframes cardRise{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
@keyframes rowIn{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
@keyframes iconBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes glowPulse{0%,100%{filter:drop-shadow(0 0 0 transparent)}50%{filter:drop-shadow(0 0 10px color-mix(in srgb,var(--ac) 25%,transparent))}}
@keyframes numberPop{from{opacity:.35;transform:translateY(5px) scale(.98)}to{opacity:1;transform:none}}
@keyframes markerPulse{0%,100%{box-shadow:0 0 14px color-mix(in srgb,var(--ac2) 35%,transparent)}50%{box-shadow:0 0 22px color-mix(in srgb,var(--ac2) 60%,transparent)}}
@keyframes rippleOut{from{opacity:.72;transform:translate(-50%,-50%) scale(.2)}to{opacity:0;transform:translate(-50%,-50%) scale(7)}}
@keyframes tapGlow{0%{filter:brightness(1);box-shadow:inherit}40%{filter:brightness(1.1);box-shadow:0 0 0 2px color-mix(in srgb,var(--ac2) 18%,transparent),0 10px 30px color-mix(in srgb,var(--ac2) 14%,transparent)}100%{filter:brightness(1);box-shadow:inherit}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px) scale(.94)}to{opacity:1;transform:translate(-50%,0) scale(1)}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media(max-width:700px){body::before,body::after{width:55vw;height:55vw;opacity:.1}.toggle{width:auto;max-width:max-content;justify-content:flex-start}.toggle small{margin-left:0}}

.danger:disabled{opacity:.45;cursor:not-allowed;filter:saturate(.6)}
.tap-spark{position:fixed;left:0;top:0;width:3px;height:3px;border-radius:50%;pointer-events:none;z-index:1000;background:#fff;box-shadow:0 0 7px color-mix(in srgb,var(--ac2) 65%,transparent);transform:translate(-50%,-50%) scale(.35);opacity:0;animation:sparkPing .16s cubic-bezier(.2,.8,.2,1) var(--delay) forwards}.tap-flare{position:fixed;left:0;top:0;width:34px;height:34px;border-radius:50%;pointer-events:none;z-index:999;background:radial-gradient(circle,rgba(255,255,255,.22),color-mix(in srgb,var(--ac2) 16%,transparent) 34%,transparent 72%);filter:blur(1px);transform:translate(-50%,-50%) scale(.45);opacity:0;animation:flarePing .18s cubic-bezier(.2,.8,.2,1) forwards}

const qolWorkoutBits=()=>{if(view!=='today'||!S.cur)return;const p=document.querySelector('.picker');if(!p)return;const n=S.cur.ex?.[ci]?.n,prev=qolPrevSet(n);if(!document.querySelector('#qol-workout-tools')){const box=document.createElement('div');box.id='qol-workout-tools';box.innerHTML=`<div class=qol-last><div><small>LAST TIME</small><b>${prev?`${prev.kg} kg × ${prev.reps}${prev.rpe?' · RPE '+prev.rpe:''}`:'No previous set'}</b>${prev?.date?`<small>${prev.date}</small>`:''}</div>${prev?'<button class=pill data-qol=repeatLast>Repeat</button>':''}</div><div class=qol-typed><label>Weight <span>${S.set.unit||'kg'}</span><input id=qol-weight inputmode=decimal value="${qolFormat(dr.kg)}" step="${Math.max(.1,dr.st*((S.set.unit||'kg')==='lb'?2.20462:1))}"></label><label>Reps<input id=qol-reps inputmode=numeric value="${dr.reps}" step=1 min=1 max=30></label></div><div class=qol-notes><label>RPE <select id=qol-rpe><option value="">RPE</option>${[6,7,8,9,10].map(x=>`<option value="${x}">${x}</option>`).join('')}</select></label><label class=qol-grow>Note <input id=qol-note placeholder="Optional set note"></label></div>`;p.parentElement?.insertBefore(box,p)}else{const w=$('#qol-weight');if(w&&document.activeElement!==w)w.value=qolFormat(dr.kg);const r=$('#qol-reps');if(r&&document.activeElement!==r)r.value=dr.reps;const u=document.querySelector('#qol-workout-tools .qol-typed label span');if(u)u.textContent=S.set.unit||'kg'}qolAnnotateSets()};
const qolAnnotateSets=()=>{const c=S.cur?.ex?.[ci];if(!c)return;document.querySelectorAll('.srow').forEach((row,i)=>{const z=c.sets[i];row.querySelector('.qol-meta')?.remove();if(z?.rpe||z?.note){const m=document.createElement('small');m.className='qol-meta';m.textContent=[z.rpe?'RPE '+z.rpe:'',z.note||''].filter(Boolean).join(' · ');row.append(m)}})};
const qolRender=()=>{qolProfileCard();qolHistoryCard();qolWorkoutBits();if(S.cur&&view==='today'&&qolState.endAt)qolRenderRest()};
const qolStart=()=>{qolSetupStaples();qolApplyCustomAliases();const observer=new MutationObserver(()=>requestAnimationFrame(qolRender));observer.observe($('#v'),{childList:true,subtree:true});qolRender();
 const origLog=A.log;A.log=()=>{const note=$('#qol-note')?.value.trim()||'',rpe=num($('#qol-rpe')?.value),before=Date.now();origLog();const z=S.cur?.ex?.[ci]?.sets?.at(-1);if(z){z.note=note||undefined;z.rpe=rpe||undefined;z.bw=bwAtDate(S.cur.d);z.height=num(S.set.heightCm)||undefined;z.loggedAt=before;save()}qolRestStart(S.set.rest||90);qolRender()};
 A.start=A.start;document.addEventListener('input',e=>{const id=e.target.id;if(id==='qol-weight'){dr.kg=Math.min(dr.hi,Math.max(dr.lo,qolKg(e.target.value)));syncPickers()}else if(id==='qol-reps'){dr.reps=Math.min(30,Math.max(1,Math.round(num(e.target.value)||1)));syncPickers()}else if(id==='qol-rest-setting'){S.set.rest=Math.min(600,Math.max(30,Math.round(num(e.target.value)/15)*15));save()}});
 document.addEventListener('change',e=>{const s=e.target;if(s.matches('[data-qol-map]')){const name=s.dataset.qolMap,c=S.custom.find(x=>x.n===name);if(c){c.rank=s.value||'';if(c.rank)R.alias[name]=c.rank;else delete R.alias[name];save();render()}}});
 document.addEventListener('click',e=>{const b=e.target.closest('[data-qol]');if(!b)return;const a=b.dataset.qol;if(a==='progress')qolShowProgress();if(a==='plate')qolShowPlate();if(a==='closeModal'||a==='modalBg'||e.target.classList.contains('qol-modal-bg'))qolCloseModal();if(a==='restPlus')qolState.endAt+=30e3;if(a==='restStop')qolStopRest();if(a==='repeatLast'){const z=qolPrevSet(S.cur?.ex?.[ci]?.n);if(z){dr.kg=num(z.kg);dr.reps=num(z.reps);syncPickers();qolRender()}}if(a==='unit'){S.set.unit=b.dataset.v;save();render()}if(a==='ageAdjust'){S.set.ageAdjust=S.set.ageAdjust===false;Object.values(S.rk).forEach(r=>r.age=S.set.age||r.age);save();render();toast(S.set.ageAdjust?'Age adjustment on':'Age adjustment off')}if(a==='heightAdjust'){S.set.heightAdjust=S.set.heightAdjust===false;save();render();toast(S.set.heightAdjust?'Height / ROM adjustment on':'Height / ROM adjustment off')}if(a==='calcPlates'){const total=qolKg($('#qol-plate-target')?.value),bar=qolKg($('#qol-plate-bar')?.value)||20,r=qolPlatePlan(total,bar);const out=r.plates.length?r.plates.map(x=>`${x.count} × ${x.plate} kg / side`).join('<br>'):'No plates needed';const rem=r.exact?'Exact load':'Closest possible with current plate set';const el=$('#qol-plate-result');if(el)el.innerHTML=`<b>${r.side.toFixed(2)} kg / side</b><br>${out}<br><small>${rem}${r.exact?'':` · ${r.remainder.toFixed(2)} kg left per side`}</small>`}});
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&qolState.endAt>Date.now())qolAcquireWake()});
};
setTimeout(qolStart,0);

</script></body></html>
