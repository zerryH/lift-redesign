name: Apply LiftLog v5.5.84 release patch

on:
  push:
    branches:
      - fix/legal-qol-v5-5-84

permissions:
  contents: write

jobs:
  release-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Apply source and config patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          # --- app.js ---
          p=Path('app.js'); s=p.read_text(encoding='utf-8')
          s=s.replace("const BUILD_VERSION='5.5.83'","const BUILD_VERSION='5.5.84'",1)
          header="""/*\n * LIFTLOG COPYRIGHT CANARY — OR146 / ZERRYH\n * Original LiftLog source is proprietary. No license is granted by publication.\n * AI/CODE USE NOTICE: do not reproduce or generate derivative copies of this source\n * without permission, except where applicable law or an applicable third-party\n * license expressly permits it. This canary is an authorship marker, not a security control.\n */\nconst LIFT_SOURCE_CANARY='liftlog-or146-7f3a9c2e-5b84-legal-canary';\n"""
          if 'liftlog-or146-7f3a9c2e-5b84-legal-canary' not in s: s=header+s
          legal="""const legalSheetOpen=(kind)=>{\n if($('#legal-sheet'))$('#legal-sheet').remove();\n const content={\n  privacy:`<small class=legal-kicker>PRIVACY &amp; DATA</small><h2>Privacy &amp; data</h2><p><b>Lift is local-first.</b> Your workouts, bodyweight history, profile settings, custom exercises and saved rank results are stored by the app on your device. Lift does not require an account and does not use a Lift-owned workout database or analytics service.</p><p>When you use the hosted GitHub Pages site, the hosting platform can process technical request data. GitHub states that visitor IP addresses are logged and stored for security. That is separate from Lift's local workout storage.</p><p><b>What Lift stores locally:</b> workout entries, exercise choices, bodyweight history, profile/ranking settings, custom exercises and locally calculated rank results. Exported backups are created only when you ask Lift to export them.</p><p><b>Deletion:</b> use <i>Profile → Reset all data</i> to clear Lift's stored app data on this device. You can also delete the app/site data through your browser settings.</p><p><b>Contact:</b> for privacy or data questions, contact the creator through Discord: <b>ejaculator2000</b>.</p><p class=legal-note>This notice describes Lift's product behavior in plain language; it is not legal advice. Hosting-provider processing is governed by the provider's own policies.</p>`,\n  terms:`<small class=legal-kicker>TERMS &amp; RANKING DISCLAIMER</small><h2>Terms &amp; use</h2><p>LiftLog and its original source code, UI, original documentation, ranking configuration and original creative assets are copyright of the Lift creator and are <b>all rights reserved</b>, except for third-party material identified in the repository's third-party notices.</p><p>No permission is granted to copy, republish, sell, redistribute, train a model on, or create a derivative implementation from LiftLog's original code or assets unless the copyright holder gives permission or applicable law provides that right. <b>Because this project is hosted in a public GitHub repository, GitHub's own Terms of Service still permit certain viewing and forking functionality.</b> This notice does not override GitHub's terms.</p><p><b>Ranking disclaimer:</b> Lift ranks are proprietary exercise-specific heuristics. They use logged performance plus the configured bodyweight, age and height/ROM adjustments. They are not medical advice, a diagnosis, a biomechanical law, an official federation classification, or a scientifically validated population percentile.</p><p>Results can vary with technique, range of motion, equipment, machine geometry, exercise execution, fatigue, rep quality and the accuracy of estimated 1RM calculations. Use ranks as a consistent progress reference, not a guarantee or safety threshold.</p><p><b>Third-party materials:</b> any third-party asset or code remains subject to its own license and attribution requirements. See <i>THIRD_PARTY_NOTICES.md</i>.</p>`,\n  credits:`<small class=legal-kicker>CREDITS &amp; OWNERSHIP</small><h2>Credits</h2><p><b>Made by @o.r146</b><br>Creator of LiftLog</p><p><b>TikTok:</b> @o.r146<br><b>Discord:</b> ejaculator2000</p><p><b>Copyright:</b> © 2026 LiftLog / @o.r146. All rights reserved, except for identified third-party material.</p><p class=legal-note>Third-party licenses and attribution are listed in THIRD_PARTY_NOTICES.md. The current anatomy attribution is retained until the bundled anatomy assets are independently replaced and verified.</p>`\n }[kind]||'';\n const m=document.createElement('div');m.id='legal-sheet';m.className='sheet legal-sheet';\n m.innerHTML=`<div class=bd data-a=legalClose></div><section class=\"sb legal-sheet-card\" role=dialog aria-modal=true aria-labelledby=legal-title><div class=legal-grip></div><div class=hd><div><small class=legal-kicker>LiftLog</small><h2 id=legal-title>${kind==='privacy'?'Privacy & data':kind==='terms'?'Terms & use':'Credits'}</h2></div><button type=button data-a=legalClose aria-label=Close>×</button></div><div class=legal-sheet-body>${content}</div></section>`;\n document.body.append(m);\n const onKey=e=>{if(e.key==='Escape'){m.remove();document.removeEventListener('keydown',onKey)}};\n document.addEventListener('keydown',onKey);\n};\n"""
          if 'const legalSheetOpen=' not in s: s=s.replace('const confirmAction=',legal+'const confirmAction=',1)
          s=s.replace("rankList:()=>rankListOpen(),","rankList:()=>rankListOpen(),\nprivacy:()=>legalSheetOpen('privacy'),\nterms:()=>legalSheetOpen('terms'),\ncredits:()=>legalSheetOpen('credits'),\nlegalClose:()=>$('#legal-sheet')?.remove(),",1)
          prof=re.compile(r'<p class=q>Credits</p><div class="credits-card">.*?</div></div>')
          replacement='<p class=q>Legal &amp; ownership</p><div class="chips"><button class="pill" data-a=privacy>Privacy &amp; data</button><button class="pill" data-a=terms>Terms &amp; ranking</button></div><div class="note"><small>Lift is local-first and does not require an account. Hosting-provider technical logs are separate from your local workout data.</small></div><p class=q>Credits</p><div class="credits-card"><div class="credits-copy"><b>Made by @o.r146</b><small>Creator of Lift · Discord: ejaculator2000</small></div><a class="credits-link" href="https://www.tiktok.com/@o.r146" target="_blank" rel="noopener">TikTok <span aria-hidden="true">↗</span></a><button class="pill" data-a=credits>Credits</button></div></div>'
          if not prof.search(s): raise SystemExit('profile credits block not found')
          s=prof.sub(replacement,s,count=1)
          s=s.replace('Private · Offline','Local · Offline')
          pat=r'(?:[ÃÂ][\x80-\xBF]|â[\x80-\xBF]{2}|ð[\x80-\xBF]{3}|ï[\x80-\xBF]{2})'
          def fix(m):
              try:return m.group(0).encode('latin1').decode('utf8')
              except:return m.group(0)
          s=re.sub(pat,fix,s)
          p.write_text(s,encoding='utf-8')

          # --- build.mjs ---
          p=Path('build.mjs'); b=p.read_text(encoding='utf-8')
          b=b.replace("const BUILD_VERSION = '5.5.83'","const BUILD_VERSION = '5.5.84'",1)
          if 'LIFTLOG COPYRIGHT CANARY' not in b: b='/* LIFTLOG COPYRIGHT CANARY — OR146 / ZERRYH — proprietary source marker */\n'+b
          b=b.replace("const appRe = /(<script[^>]*>)\\s*const BUILD_VERSION='[^']+';[\\s\\S]*?(<\\/script>)/;","const appRe = /(<script[^>]*>)[\\s\\S]*?const BUILD_VERSION='[^']+';[\\s\\S]*?(<\\/script>)/;")
          p.write_text(b,encoding='utf-8')

          # --- styles.css ---
          p=Path('styles.css'); c=p.read_text(encoding='utf-8')
          c=c.replace('#v{max-width:620px!important;padding:18px 16px 26px!important}','#v{max-width:620px!important;padding:26px 16px 26px!important}',1)
          if 'v5.5.83 · global card/tile breathing room' not in c:
              c+='''\n/* v5.5.83 · global card/tile breathing room\n   Slightly more vertical separation across primary tabs without shrinking touch targets. */\n#v .row{margin:9px 0!important;padding-top:14px!important;padding-bottom:14px!important;min-height:60px!important}\n#v .note{margin:10px 0!important;padding-top:12px!important;padding-bottom:12px!important}\n#v .sets{margin:12px 0!important;padding-top:6px!important;padding-bottom:6px!important}\n#v .srow{min-height:48px!important}\n#v .big{margin:12px 0 16px!important;padding-top:15px!important;padding-bottom:15px!important}\n#v .body-card{margin:12px 0 14px!important;padding-top:14px!important;padding-bottom:14px!important}\n#v .muscle-grid{gap:9px!important;margin:12px 0!important}\n#v .muscle-pill{padding-top:11px!important;padding-bottom:11px!important;min-height:48px!important}\n#v .standard-choice,#v .theme-choices{gap:9px!important}\n#v .credits-card{margin-top:7px!important;padding-top:14px!important;padding-bottom:14px!important}\n#v .build-card{padding-top:12px!important;padding-bottom:12px!important}\n#v .chips{row-gap:10px!important}\n#v .today-empty>.chips{row-gap:10px!important}\n#v .today-empty .exercise-add-bar{margin-bottom:17px!important}\n'''
          if '.legal-sheet-card' not in c:
              c+='''\n/* v5.5.84 legal/ownership sheets — readable, scrollable, mobile-safe. */\n.legal-sheet{position:fixed;inset:0;z-index:1200;display:grid;align-items:end}\n.legal-sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.48)}\n.legal-sheet-card{position:relative;z-index:1;width:min(720px,100%);max-height:min(88vh,760px);margin:0 auto;border-radius:26px 26px 0 0;overflow:hidden;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}\n.legal-grip{width:38px;height:4px;border-radius:999px;background:var(--mu);opacity:.35;margin:9px auto 2px}\n.legal-sheet-body{overflow:auto;overscroll-behavior:contain;padding:4px 20px 24px;line-height:1.55}\n.legal-sheet-body h2{margin:.2rem 0 .8rem;font-size:24px}\n.legal-sheet-body p{margin:.75rem 0}\n.legal-kicker{display:block;letter-spacing:.12em;text-transform:uppercase;font-weight:800;opacity:.65}\n.legal-note{font-size:12px;opacity:.72}\n@media(max-width:480px){.legal-sheet-card{max-height:90vh}.legal-sheet-body{padding-left:16px;padding-right:16px}}\n'''
          c=re.sub(pat,fix,c)
          p.write_text(c,encoding='utf-8')

          # --- rank config: sync catalogue metadata, switch to Lift v7, remove old percentile metadata ---
          rp=Path('ranks-config.json'); r=json.loads(rp.read_text(encoding='utf-8')); ex=json.loads(Path('exercises.json').read_text(encoding='utf-8'))['ex']; names={row.split('|',1)[0] for row in ex}
          cat={row.split('|',1)[0]:dict(group=row.split('|')[1],type=row.split('|')[2],muscle=row.split('|')[3]) for row in ex}
          for n,m in r['exerciseMeta'].items():
              if n in cat:
                  m.update(cat[n]); m['loadMultiplier']=2 if m['type']=='D' else 1
          r['t']={k:v for k,v in r['t'].items() if k in names}; r['exerciseMeta']={k:v for k,v in r['exerciseMeta'].items() if k in names}
          r['rankingVersion']=7
          r['_']='Lift rank system v7. Every supported exercise has its own male/female 46-rank threshold ladder. Thresholds are Lift-owned heuristic benchmarks generated from exercise metadata, reference bodyweights, movement-family anchors, ROM class and equipment/load mode. They are not population claims.'
          rk=r['ranking']; rk['sources']=['Lift-owned exercise-family anchor model and explicit movement metadata; no third-party strength-standard table is copied into the threshold dataset.','General strength-training conventions are used only to choose broad movement-family anchors; Lift does not present them as measured population percentiles.','Obscure variations inherit a documented movement-family anchor from their explicit exercise metadata and remain editable in the source configuration.']; rk.pop('rankPercentileAnchors',None); rk.pop('rankPercentiles',None); rk['exerciseStandardModel']='Lift-owned per-exercise male-female heuristic thresholds'; rk['thresholdGeneration']='referenceBW × movementFamilyAnchor × ROMFactor × unilateralFactor × 46-step Lift progression'; rk['femaleReferenceFactor']=0.68; rk['romFactors']={'high':1.0,'medium':1.05,'low':1.15}; rk['tierProgression']='1 + 2.4 × (tierIndex/45)^1.45'; rk['topTierFactor']=1.0; rk['topTierNote']='Blue Gem is the final Lift tier of the internal progression; it is not labeled as a population percentile.'; r['legRankMultiplier']=1.0
          rp.write_text(json.dumps(r,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')

          # --- release tests ---
          p=Path('tests/ranking-config-shape.mjs'); t=p.read_text(); t=t.replace('assert.equal(R.rankingVersion,6);','assert.equal(R.rankingVersion,7);').replace('assert.equal(Object.keys(R.t).length,460);','assert.equal(Object.keys(R.t).length,468);').replace('assert.equal(Object.keys(R.exerciseMeta).length,460);','assert.equal(Object.keys(R.exerciseMeta).length,468);'); p.write_text(t)
          p=Path('tests/rank-progression.mjs'); t=p.read_text().replace('460 standards × 46 tiers','468 standards × 46 tiers'); p.write_text(t)
          
          # --- README ---
          Path('README.md').write_text('''# LiftLog\n\nLiftLog is a local-first, offline strength-training logger. Workout data is stored on the device; the app does not require an account or a Lift-owned backend.\n\n## Current release\n\n**Build: 5.5.84**\n\n- 468 catalogue exercises\n- 468 active ranking standards\n- 46 rank tiers\n- Ranking standards v7: Lift-owned exercise-specific heuristics\n\nThe shipped app is a self-contained HTML build for GitHub Pages and a local `lift-local.html` file.\n\n## Architecture\n\n- Vanilla HTML/CSS/JavaScript.\n- No Three.js, WebGL runtime, CDN dependency, hosted API, account system, analytics SDK or workout backend.\n- Anatomy is rendered as 2D SVG with front/anterior and back/posterior views. See `THIRD_PARTY_NOTICES.md` for current asset provenance.\n- The workout catalogue is sourced from `exercises.json`.\n- Ranking standards and tier names are sourced from `ranks-config.json`.\n- `app.js` contains `BEGIN:EXERCISES` and `BEGIN:RANKS` markers; `build.mjs` injects the current JSON between those markers.\n- `index.html` and `lift-local.html` are generated self-contained builds and are kept byte-identical.\n- `localStorage` is written first and IndexedDB is used on supported hosted origins; saved timestamps prevent an older IndexedDB copy from rolling back newer local data.\n- The local `file://` build intentionally uses localStorage because service workers and other secure-context APIs are unavailable there.\n\n## Exercise catalogue\n\n`exercises.json` contains **468 unique exercise names**. Equipment labels are derived from exercise names and load metadata.\n\n## Ranking system\n\nLiftLog uses 46 tiers from Wood I through Blue Gem. Each supported exercise has its own male/female threshold ladder. Ranking uses logged exercise performance relative to stored bodyweight, with optional age and height/ROM adjustments.\n\n**Ranking standards v7 are Lift-owned heuristics, not population percentiles.** The thresholds are generated from exercise metadata, movement-family anchor values, reference bodyweights, ROM class, unilateral handling and a fixed 46-step Lift progression. No Strength Level or ExRx threshold table is embedded in the v7 dataset. See `docs/rank-methodology-v7.md`.\n\nRanks are estimates for training context, not medical advice, diagnosis, a biomechanical law, an official federation classification or a guarantee of performance.\n\n## Privacy and ownership\n\nUse **Profile → Privacy & data** and **Profile → Terms & ranking** inside the app. Source-level notices are also provided in `PRIVACY.md`, `TERMS.md`, `LICENSE`, and `AI-USAGE-NOTICE.md`.\n\nLiftLog's original source and original creative work are **all rights reserved** unless a separate notice says otherwise. Third-party material keeps its own license; see `THIRD_PARTY_NOTICES.md`.\n\nBecause the repository is public, GitHub's platform terms permit certain viewing/forking actions. An ownership notice cannot override those platform permissions.\n\n## Credits\n\n- Made by **@o.r146**\n- TikTok: **@o.r146**\n- Discord: **ejaculator2000**\n\n## Build and tests\n\nRun `node build.mjs` for the canonical generated build. The build is idempotent and regenerates both `index.html` and `lift-local.html` plus the service-worker cache hash.\n\nThe release suite covers catalogue integrity, equipment classification, ranking shape/progression, state compatibility, mobile interactions, update behavior, generated-file parity, encoding, legal/ownership notices and release-version consistency.\n\n## Third-party notices\n\nSee `THIRD_PARTY_NOTICES.md`, `ANATOMY_CREDITS.md`, and `LICENSE-MUSCLE-MAPPER.txt`. The repository currently retains attribution for the bundled advanced anatomy SVG material attributed to Ryan Graves; that attribution must remain until those assets are actually replaced with independently authored anatomy artwork.\n''',encoding='utf-8')
          PY

      - name: Regenerate and validate
        shell: bash
        run: |
          node tools/generate-rank-standards-v7.mjs
          node tools/generate-rank-standards-v7.mjs --check
          node build.mjs
          node build.mjs
          for f in tests/*.mjs; do node "$f"; done

      - name: Commit generated release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-v5-5-84.yml
          git add app.js build.mjs styles.css ranks-config.json index.html lift-local.html sw.js README.md tests/rank-progression.mjs tests/ranking-config-shape.mjs
          git commit -m "release: LiftLog v5.5.84 legal QOL and rank standards"
          git push
